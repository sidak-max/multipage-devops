apiVersion: apps/v1
kind: Deployment
metadata:
  name: multipage-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multipage-v2
  template:
    metadata:
      labels:
        app: multipage-v2
    spec:
      containers:
        - name: app
          image: sidaksingh1/multipage-app:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: multipage-v2-service
spec:
  type: LoadBalancer
  selector:
    app: multipage-v2
  ports:
    - port: 8082
      targetPort: 5000
